name: Validate standalone adapter
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['20', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: git diff --check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:package
      - name: Provision exact cezar reference
        run: node scripts/provision-cezar.mjs
      - name: External live conformance
        run: npm run test:contract:live
        env:
          CEZAR_CONTRACT_ARTIFACT: .ai/tmp/reference/artifact.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance-node-${{ matrix.node }}
          path: .ai/qa/artifacts_live/
          if-no-files-found: ignore
